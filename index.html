<script>const D={"chapters": [[1, "Old Major's Vision", "🌙", "Old Major explains that humans exploit the animals and imagines a free, equal community.", ["Old Major identifies exploitation as a shared problem.", "His inclusive rhetoric creates solidarity.", "The dream of equality is hopeful but untested."], ["All animals are comrades.", "The inclusive word “all” establishes a universal ideal."]], [2, "Rebellion and Commandments", "🚩", "Hunger triggers rebellion. The farm is renamed, rules are written and the missing milk foreshadows privilege.", ["Material hardship triggers political change.", "The pigs gain authority through literacy.", "The missing milk foreshadows inequality."], ["Whatever goes upon two legs is an enemy.", "The absolute wording simplifies political identity."]], [3, "Education and Early Privilege", "📚", "The harvest succeeds, but unequal literacy creates hierarchy and Squealer defends special treatment for the pigs.", ["Education becomes political power.", "Squealer disguises self-interest as necessity.", "Slogans replace complex thought."], ["Surely, comrades, you do not want Jones back?", "The rhetorical question uses fear to silence criticism."]], [4, "The Battle of the Cowshed", "🛡️", "Snowball organises the successful defence of the farm. Later propaganda will erase his contribution.", ["Snowball demonstrates practical leadership.", "Violence initially defends the revolution.", "Official ceremony shapes collective memory."], ["The only good human being is a dead one.", "The absolute statement reveals dangerous ideological simplification."]], [5, "Snowball's Expulsion", "🐕", "Napoleon releases the dogs, expels Snowball and ends open debate. Boxer adopts absolute loyalty.", ["Coercion replaces debate.", "Freedom is removed step by step.", "Boxer's loyalty becomes politically dangerous."], ["Napoleon is always right.", "The absolute adverb “always” reveals unquestioning obedience."]], [6, "Windmill and Changing Rules", "🌬️", "The animals labour on the windmill, the pigs trade with humans and the commandments begin to change.", ["The windmill absorbs labour and hope.", "Small rule changes weaken resistance.", "Snowball becomes a political scapegoat."], ["No animal shall sleep in a bed with sheets.", "The added qualification disguises a broken commandment."]], [7, "Confessions and Executions", "⚠️", "Hunger, forced confessions and executions transform political authority into terror.", ["The regime conceals material hardship.", "Confession becomes political theatre.", "Violence destroys the earlier moral code."], ["The dogs promptly tore their throats out.", "The brutal verb “tore” presents immediate, dehumanising violence."]], [8, "Cult of Personality", "🏛️", "Napoleon is praised through titles, poems and statistics while the windmill is destroyed and rules continue changing.", ["Personal worship replaces collective leadership.", "Statistics manufacture success.", "Political failure is hidden by propaganda."], ["No animal shall kill any other animal without cause.", "The added words excuse state violence after the event."]], [9, "Boxer's Fate", "💔", "Boxer collapses and is sold, while Squealer replaces witnessed evidence with an official story.", ["The regime exploits Boxer until he is useless.", "Benjamin understands too late.", "Propaganda overwrites direct evidence."], ["I will work harder!", "The maxim becomes tragic because exploitation produces still more labour."]], [10, "Pigs and Humans", "🐷", "The pigs walk on two legs, carry whips and become indistinguishable from the former human rulers.", ["The revolution reproduces oppression.", "Contradiction becomes official truth.", "Loss of memory prevents accountability."], ["All animals are equal, but some animals are more equal than others.", "The paradox exposes a grotesque distortion of equality."]]], "themes": [["Power and corruption", "Authority begins as collective liberation but becomes coercive when concentrated in an unaccountable elite.", "Orwell published the novella in 1945 after the Russian Revolution had developed into Stalin's authoritarian rule. Opposition was suppressed, political violence expanded and hardship was hidden behind official claims of progress.", [1, 2, 5, 7, 8, 10], "Orwell warns that revolutionary ideals can be corrupted when citizens surrender scrutiny and leaders gain unchecked authority."], ["Propaganda and language", "Language can inspire unity, simplify thought, manufacture fear and replace observable truth.", "Stalinist propaganda controlled speeches, newspapers, statistics and historical accounts. Opponents could be rewritten as traitors and shortages presented as success.", [1, 3, 5, 6, 8, 9, 10], "Orwell warns that political language becomes dangerous when citizens cannot test it against evidence and memory."], ["Equality and inequality", "A universal promise of equality is gradually replaced by privilege, hierarchy and exploitation.", "The Russian Revolution promised to replace Tsarist inequality, but a privileged political elite developed while many workers and peasants endured repression and hardship.", [1, 2, 3, 6, 9, 10], "Orwell criticises regimes that preserve the language of equality while creating material and legal privilege."], ["Education and ignorance", "Unequal literacy limits independent judgement and allows a small group to control laws and records.", "Authoritarian systems often restrict reliable information. Orwell presents political education as essential because citizens who cannot verify claims become dependent on official explanations.", [2, 3, 5, 6, 9, 10], "Orwell suggests that freedom requires critical education, reliable records and the confidence to challenge authority."], ["Violence and fear", "Political obedience becomes enforced through intimidation, punishment and lethal force.", "Stalin's government used secret police, purges, forced confessions and executions. Public trials turned violence into political theatre.", [4, 5, 6, 7, 8], "Orwell traces violence from collective defence into an instrument used by rulers against the population."], ["Memory and truth", "Weak collective memory allows leaders to revise history, deny contradictions and control the past.", "Authoritarian regimes alter public records and remove rivals from official histories. Orwell later developed this concern extensively in Nineteen Eighty-Four.", [4, 6, 7, 8, 9, 10], "Orwell warns that freedom depends on preserving evidence and comparing present claims with reliable memory."]], "characters": [["Napoleon", [2, 3, 5, 6, 7, 8, 9, 10], "a duplicitous political leader", "A calculating, increasingly tyrannical leader who consolidates power through fear, propaganda and the removal of rivals."], ["Snowball", [2, 3, 4, 5, 6, 7], "a politically useful scapegoat", "An energetic organiser whose real contribution is later erased by propaganda."], ["Boxer", [2, 3, 4, 5, 6, 7, 8, 9], "an obsequious acceptance of authority", "A loyal worker whose admirable ethic becomes politically dangerous because it replaces critical judgement."], ["Squealer", [2, 3, 5, 6, 7, 8, 9, 10], "a calculated manipulation of language", "A duplicitous propagandist who makes contradiction appear reasonable."], ["Old Major", [1, 2, 10], "a fragile vision of collective equality", "A visionary whose egalitarian ideals inspire rebellion but are later corrupted."], ["Clover", [1, 3, 6, 7, 9, 10], "an uneasy awareness of injustice", "A compassionate observer who senses betrayal but lacks the literacy and confidence to resist."], ["Benjamin", [1, 3, 5, 6, 9, 10], "a politically ineffective cynicism", "A literate cynic whose insight does not become action until too late."], ["Mollie", [1, 2, 3, 5], "a superficial attachment to privilege", "A self-interested mare whose love of comfort reveals limited commitment to collective ideals."]], "vocab": [["duplicitous", "dishonest and two-faced", "engañoso", "Napoleon / Squealer", "propaganda and power"], ["insidious", "gradually harmful and hard to notice", "insidioso", "Napoleon", "power and corruption"], ["tyrannical", "cruelly controlling", "tiránico", "Napoleon", "power and violence"], ["pernicious", "seriously harmful", "pernicioso", "Squealer", "propaganda"], ["obsequious", "overly obedient", "servil", "Boxer", "obedience"], ["sanctimonious", "pretending moral superiority", "moralista hipócrita", "pigs", "hypocrisy"], ["avaricious", "excessively greedy", "avaricioso", "pigs", "inequality"], ["malevolent", "wishing or causing harm", "malévolo", "dogs", "violence"], ["dogmatic", "treating beliefs as unquestionable", "dogmático", "sheep", "propaganda"], ["totalitarian", "involving complete political control", "totalitario", "Napoleon's regime", "power"], ["oppressive", "harsh and restrictive", "opresivo", "regime", "freedom"], ["exploitative", "benefiting unfairly from others", "explotador", "pigs", "class and labour"], ["subversive", "challenging an established system", "subversivo", "Orwell", "authorial purpose"], ["dehumanising", "removing dignity", "deshumanizador", "regime", "violence"], ["authoritarian", "demanding obedience", "autoritario", "Napoleon", "leadership"], ["megalomaniacal", "obsessed with personal power", "megalómano", "Napoleon", "cult of personality"], ["propagandistic", "designed to shape opinion", "propagandístico", "Squealer", "language"], ["grotesque", "distorted and shocking", "grotesco", "final commandment", "equality"], ["portentous", "suggesting serious future events", "ominoso", "missing milk", "foreshadowing"], ["squalid", "extremely dirty and unpleasant", "sórdido", "farm conditions", "poverty"], ["decrepit", "worn out by age or neglect", "decrépito", "Boxer", "labour"], ["corrosive", "gradually destructive", "corrosivo", "power", "corruption"], ["histrionic", "excessively dramatic", "histriónico", "Squealer", "propaganda"], ["egalitarian", "supporting equality", "igualitario", "Old Major", "equality"], ["ideologically charged", "strongly shaped by politics", "cargado ideológicamente", "commandments", "language"]], "phrases": [["an insidious abuse of power", "a gradual hidden misuse of authority", "Napoleon", "power"], ["a duplicitous political leader", "a dishonest leader", "Napoleon", "leadership"], ["a grotesque distortion of equality", "equality changed into injustice", "final commandment", "equality"], ["a pernicious form of propaganda", "seriously harmful political persuasion", "Squealer", "propaganda"], ["a morally bankrupt regime", "a government without moral principles", "pigs", "power"], ["an increasingly tyrannical authority", "a ruler becoming more cruel", "Napoleon", "violence"], ["a corrosive pursuit of power", "a search for power that destroys morality", "Napoleon", "corruption"], ["a calculated manipulation of language", "deliberate linguistic control", "Squealer", "language"], ["an obsequious acceptance of authority", "overly obedient submission", "Boxer", "obedience"], ["a dehumanising system of control", "a system removing dignity", "dogs", "violence"], ["a subversive critique of totalitarianism", "a challenge to complete control", "Orwell", "purpose"], ["the systematic erosion of freedom", "freedom removed step by step", "meetings", "freedom"]], "exam": {"Characters": [["Napoleon", "How does Orwell present Napoleon as a leader?"], ["Snowball", "How does Orwell present Snowball as an important character?"], ["Boxer", "How does Orwell present Boxer as an important character?"], ["Squealer", "How does Orwell present Squealer and persuasion?"], ["Old Major", "How does Orwell present Old Major's importance?"], ["Clover", "How does Orwell present Clover's response to the revolution?"], ["Benjamin", "How does Orwell present Benjamin and inaction?"], ["Mollie", "How does Orwell present Mollie's attitude to the revolution?"], ["The dogs", "How does Orwell use the dogs to present control?"], ["The sheep", "How does Orwell use the sheep to present unthinking obedience?"]], "Themes and ideas": [["Power and corruption", "How does Orwell present the corruption of power?"], ["Propaganda", "How does Orwell present the manipulation of language?"], ["Equality", "How does Orwell present equality and inequality?"], ["Education", "How does Orwell present the importance of education?"], ["Violence and fear", "How does Orwell present fear and violence as control?"], ["Leadership", "How does Orwell present different kinds of leadership?"], ["Class and exploitation", "How does Orwell present exploitation and class?"], ["Memory and truth", "How does Orwell present memory and truth?"], ["Betrayal", "How does Orwell present the betrayal of ideals?"], ["Freedom", "How does Orwell present the loss of freedom?"], ["Responsibility", "How does Orwell present responsibility for tyranny?"], ["Hope", "How does Orwell present hope at the beginning and end?"], ["Loyalty", "How does Orwell present loyalty as admirable and dangerous?"], ["Ignorance", "How does Orwell present ignorance as a political danger?"], ["Work", "How does Orwell present work and workers?"]], "Writer's methods": [["Allegory", "How does Orwell use allegory to communicate political ideas?"], ["Satire", "How does Orwell use satire to criticise leadership?"], ["Slogans", "How does Orwell use slogans to show simplified language?"], ["Commandments", "How does Orwell use changing commandments to present corruption?"], ["Irony", "How does Orwell use irony to expose hypocrisy?"], ["Structure", "How does Orwell use structure to present failure?"], ["Ending", "How does Orwell make the ending significant?"], ["Contrast", "How does Orwell contrast the beginning and end?"], ["Symbolism", "How does Orwell use the windmill as a symbol?"], ["Narrative perspective", "How does Orwell use limited understanding to affect the reader?"]]}},C=document.getElementById('c'),T=document.getElementById('title'),S=document.getElementById('sub'),SIDE=document.getElementById('side');const st=JSON.parse(localStorage.getItem('afv3')||'{"xp":0,"done":[]}');function save(){localStorage.setItem('afv3',JSON.stringify(st));hud()}function earn(n,id){st.xp+=n;if(id&&!st.done.includes(id))st.done.push(id);save()}function hud(){xp.textContent=st.xp+' XP';mast.textContent=Math.min(100,Math.round(st.done.length/80*100))+'% mastered'}function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function go(v){speechSynthesis.cancel();SIDE.classList.remove('open');document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.v===v));({home,story,characters,themes,quotes,vocab,phrases,writing,exam,progress})[v]()}nav.onclick=e=>{let b=e.target.closest('button');if(b)go(b.dataset.v)};menu.onclick=()=>SIDE.classList.toggle('open');
function home(){T.textContent='Animal Farm Quest';S.textContent='Complete structural edition';C.innerHTML=`<div class="hero"><h2>Ten chapters. Deep themes. Real exam writing.</h2><p>Every learning point has a model answer. Themes include historical context and direct chapter links. The exam bank covers characters, themes and methods.</p><button class="btn primary" onclick="go('story')">Start Chapter 1</button></div><h2 class="t2">Included</h2><div class="grid g3">${[['10','chapter missions'],['6','deep themes'],['8','characters'],['25','vocabulary words'],['12','phrases'],['45','exam focuses']].map(x=>`<div class="card"><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join('')}</div>`}
function story(){T.textContent='10 chapter missions';S.textContent='Mission number always equals chapter number';C.innerHTML=`<div class="call"><b>Mission 1 = Chapter 1</b>, continuing directly to Mission 10 = Chapter 10.</div><div class="grid g2" style="margin-top:15px">${D.chapters.map(x=>`<button class="quest" data-ch="${x[0]}"><div class="icon">${x[2]}</div><strong>Mission ${x[0]} · Chapter ${x[0]}: ${esc(x[1])}</strong><span>Story, responses, quotations and quiz</span></button>`).join('')}</div>`;C.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>chapter(+b.dataset.ch))}

function modelPoint(id,i,p){let endings=["It establishes the central political idea that later chapters test and corrupt.","It reveals how language, education or power affects the animals' ability to act independently.","It helps Orwell trace the movement from hopeful revolution to authoritarian control."];return p+' '+endings[i%3]}
function themes(){T.textContent='Themes and context';S.textContent='Definition, historical period, chapters and authorial purpose';C.innerHTML=`<div class="grid g2">${D.themes.map((x,i)=>`<div class="card"><h3>${esc(x[0])}</h3><p><b>Meaning:</b> ${esc(x[1])}</p><div class="call"><b>Historical and political context:</b><p>${esc(x[2])}</p></div><p><b>Relevant chapters:</b></p><div class="chapter-links">${x[3].map(n=>`<button onclick="chapter(${n})">Chapter ${n}</button>`).join('')}</div><p><b>Why Orwell presents it:</b> ${esc(x[4])}</p><div class="starter">Across the novella, Orwell develops ${esc(x[0].toLowerCase())} from... to...</div><div class="field"><textarea rows="4"></textarea></div><button class="btn outline reveal">Show model answer</button><div class="hidden model"><div class="call good">Across the novella, Orwell develops ${esc(x[0].toLowerCase())} from an initially hopeful or defensible idea into a system shaped by privilege, coercion and political manipulation.</div><div class="call"><b>Why strong:</b> it traces development, links context and states Orwell's criticism.</div></div></div>`).join('')}</div>`;C.querySelectorAll('.reveal').forEach((b,i)=>b.onclick=()=>{b.nextElementSibling.classList.toggle('hidden');earn(5,'theme'+i)})}

S.textContent='Think first, then reveal and review the model interpretation';
const answers={

const why={
1:'It connects the quotation to equality, political unity and the hopeful beginning of the novella.',

function vocab(){T.textContent='Vocabulary pathway';S.textContent='Meaning, Spanish, character, theme and use';let words=[...D.vocab].sort(()=>Math.random()-.5).slice(0,15),target=0;C.innerHTML=`<div class="card"><h3>Current clue</h3><p id="clue">${esc(words[0][1])}</p><p id="help">Spanish support appears after a mistake.</p></div><div class="bingo" style="margin-top:15px">${words.map((w,i)=>`<button data-i="${i}">${esc(w[0])}</button>`).join('')}</div><div id="vr"></div>`;C.querySelectorAll('.bingo button').forEach(b=>b.onclick=()=>{let w=words[target];if(+b.dataset.i===target){b.classList.add('marked');vr.innerHTML=`<div class="card"><h3>${esc(w[0])}</h3><p><b>Spanish:</b> ${esc(w[2])}</p><p><b>Character:</b> ${esc(w[3])}</p><p><b>Theme:</b> ${esc(w[4])}</p><div class="starter">Orwell presents...</div><textarea rows="3"></textarea><br><button class="btn primary" id="nextv">Next word</button></div>`;nextv.onclick=()=>{target++;if(target<words.length){clue.textContent=words[target][1];help.textContent='Spanish support appears after a mistake.';vr.innerHTML=''}else{vr.innerHTML='<div class="call good">Round complete: 30 XP.</div>';earn(30,'vocab')}}}else help.innerHTML='Spanish support: <b>'+esc(w[2])+'</b>. Character/theme: '+esc(w[3])+' · '+esc(w[4])})}

const boxes=[["Decode the question",["Identify the command word.","Identify the central focus.","Trace what changes across the novella.","Select relevant characters, themes and methods.","Turn the question into a provisional argument."]],["Thesis",["Answer directly.","Show development or tension.","Include Orwell's warning or criticism."]],["Introduction",["Name the overall idea.","Give the direction of the argument.","Mention form or purpose where useful."]],["Paragraph 1: beginning",["Make an early-text claim.","Select accurate evidence.","Analyse a method.","Justify the connection."]],["Paragraph 2: development",["Show change or intensification.","Use a contrasting moment.","Analyse method and effect.","Link to Orwell's criticism."]],["Paragraph 3: culmination",["Use a late-text moment.","Analyse structural significance.","Give wider significance."]],["Context",["Identify a relevant parallel.","Explain why it matters.","State Orwell's criticism.","Return to the question."]],["Conclusion",["Return to the argument.","Summarise development.","Give Orwell's final warning."]]];
function starter(s){return {"Identify the command word.":"The command word requires me to...","Identify the central focus.":"The central focus of the question is...","Trace what changes across the novella.":"Across the whole novella, I need to examine how...","Select relevant characters, themes and methods.":"The most relevant aspects are...","Turn the question into a provisional argument.":"My answer will argue that...","Answer directly.":"Orwell presents...","Show development or tension.":"Although..., ultimately...","Include Orwell's warning or criticism.":"Through this, Orwell warns that...","Name the overall idea.":"Across the novella, Orwell explores...","Give the direction of the argument.":"The idea develops from... to...","Mention form or purpose where useful.":"Through political allegory and satire...","Make an early-text claim.":"At the beginning of the novella...","Select accurate evidence.":"This is supported by...","Analyse a method.":"Orwell's use of... suggests...","Justify the connection.":"This supports the interpretation because...","Show change or intensification.":"As the novella progresses...","Use a contrasting moment.":"This contrasts with...","Analyse method and effect.":"The use of... reveals...","Link to Orwell's criticism.":"Through this, Orwell criticises...","Use a late-text moment.":"By the final stages...","Analyse structural significance.":"Structurally, this completes...","Give wider significance.":"This suggests that...","Identify a relevant parallel.":"Orwell's portrayal of... can be linked to...","Explain why it matters.":"This connection matters because...","State Orwell's criticism.":"Through this parallel, Orwell criticises...","Return to the question.":"This reinforces the idea that...","Return to the argument.":"Ultimately, Orwell presents...","Summarise development.":"The movement from... to... demonstrates...","Give Orwell's final warning.":"Orwell ultimately warns that..."}[s]||"Write your idea..."}
function writing(){T.textContent='Writing blueprint';S.textContent='Every bullet has an instruction, starter and model';C.innerHTML=boxes.map((b,bi)=>`<div class="card" style="margin-bottom:14px"><h3>${b[0]}</h3>${b[1].map((x,xi)=>`<div class="bullet"><p><b>• ${x}</b></p><div class="starter">${starter(x)}</div><textarea rows="2"></textarea><br><button class="btn outline reveal">Show model</button><div class="hidden model"><div class="call good">${starter(x).replace('...',' a precise, whole-text argument about Orwell’s presentation and purpose.')}</div></div></div>`).join('')}</div>`).join('');C.querySelectorAll('.reveal').forEach((b,i)=>b.onclick=()=>{b.nextElementSibling.classList.toggle('hidden');earn(1,'writing'+i)})}
function exam(){T.textContent='Exam question bank';S.textContent='Characters, themes and writer’s methods';let cats=Object.keys(D.exam);C.innerHTML=`<div class="call"><b>Original AQA-style practice:</b> these are plausible whole-text focuses, not predictions.</div><div class="tabs">${cats.map((x,i)=>`<button class="tab ${i?'':'active'}" data-cat="${x}">${x} (${D.exam[x].length})</button>`).join('')}</div><div id="bank"></div>`;function draw(cat){bank.innerHTML=`<div class="grid g2">${D.exam[cat].map((q,i)=>`<button class="quest" data-e="${cat}|${i}"><div class="icon">✍️</div><strong>${q[0]}</strong><span>${q[1]}</span></button>`).join('')}</div>`;C.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>task(...b.dataset.e.split('|')))}draw(cats[0]);C.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{C.querySelectorAll('[data-cat]').forEach(x=>x.classList.remove('active'));b.classList.add('active');draw(b.dataset.cat)})}
